<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ürün Retouch – Faz 2: Leke Temizleme</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&display=swap">
<style>
:root{--bg:#e8e9ec;--panel:#f7f7f8;--ink:#1b1d22;--mute:#5d6270;--line:#c7cad1;--gold:#8f6f22}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 14px/1.45 Manrope,system-ui,sans-serif;display:flex;flex-direction:column}
header{padding:14px 20px 6px}
h1{margin:0;font-size:20px;font-weight:800;letter-spacing:-.02em}
main{flex:1;min-height:0;display:grid;grid-template-columns:290px 1fr;gap:14px;padding:8px 20px 20px}
aside{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:14px;overflow:auto}
label{display:block;font-weight:600;margin:12px 0 4px}
input[type=range]{width:100%;accent-color:var(--gold)}
select{width:100%;padding:7px;border:1px solid var(--line);border-radius:4px;font:inherit;background:#fff}
button,.pick{display:block;width:100%;padding:10px 12px;border:1px solid var(--ink);background:var(--ink);color:#fff;font:600 14px Manrope,sans-serif;border-radius:4px;cursor:pointer;text-align:center}
button.alt{background:transparent;color:var(--ink)}
button:disabled{opacity:.4;cursor:default}
button+button,.pick+button,.row+button{margin-top:8px}
.row{display:flex;gap:8px}.row button{margin:0}
.seg{display:flex;border:1px solid var(--ink);border-radius:4px;overflow:hidden}
.seg label{flex:1;margin:0;padding:9px 6px;text-align:center;cursor:pointer;font-weight:600}
.seg input{position:absolute;opacity:0}
.seg label:has(input:checked){background:var(--ink);color:#fff}
.seg label:has(input:focus-visible){outline:3px solid var(--gold);outline-offset:-3px}
button:focus-visible,.pick:focus-within,input:focus-visible,select:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
#status{margin-top:12px;color:var(--mute);min-height:3em}
small{color:var(--mute);display:block;margin-top:10px}
#view{position:relative;overflow:hidden;border:1px solid var(--line);border-radius:6px;touch-action:none;cursor:none;
 background:repeating-conic-gradient(#fff 0 25%,#d9dbe0 0 50%) 0 0/20px 20px}
#cv{position:absolute;left:0;top:0;transform-origin:0 0}
#ov{position:absolute;left:0;top:0;pointer-events:none}
#cursor{position:absolute;border:1.5px solid #fff;outline:1.5px solid #000;border-radius:50%;pointer-events:none;display:none;transform:translate(-50%,-50%)}
@media(max-width:900px){main{grid-template-columns:1fr;grid-template-rows:auto 70vh}}
</style>
</head>
<body>
<header><h1>Ürün Retouch – Faz 2: Leke Temizleme</h1></header>
<main>
<aside>
  <label class="pick" style="margin:0;cursor:pointer">Fotoğraf seç (şeffaf PNG önerilir)
    <input id="file" type="file" accept="image/*" hidden>
  </label>
  <label>Araç</label>
  <div class="seg" role="radiogroup" aria-label="Araç">
    <label><input type="radio" name="tool" value="heal" checked>Leke sil</label>
    <label><input type="radio" name="tool" value="clone">Kopyala</label>
  </div>
  <div id="healOpts">
    <label for="mode">Yüzey türü</label>
    <select id="mode"><option value="auto">Otomatik</option><option value="smooth">Düzgün / cilalı</option><option value="texture">Dokulu / mat</option></select>
    <label for="grain">Gren (cilalı yüzeyde)</label>
    <input id="grain" type="range" min="0" max="100" value="40">
  </div>
  <label for="size">Fırça boyutu: <span id="sizeV">30</span> px</label>
  <input id="size" type="range" min="4" max="300" value="30">
  <label for="bgsel">Önizleme zemini</label>
  <select id="bgsel"><option value="checker">Damalı</option><option value="white">Beyaz</option><option value="dark">Koyu</option></select>
  <div class="row" style="margin-top:14px">
    <button id="undo" class="alt" disabled>Geri al</button>
    <button id="fit" class="alt" disabled>Sığdır</button>
  </div>
  <button id="dl" disabled>PNG indir</button>
  <div id="status" role="status" aria-live="polite">Bir fotoğraf seç.</div>
  <small>Leke üzerini boya, bırakınca silinir. Kopyala aracında önce <b>Option (Alt)</b> basılı tıklayıp kaynağı seç, sonra boya. Yakınlaştırma: fare tekerleği. Kaydırma: Boşluk tuşu ile sürükle. Geri al: Cmd/Ctrl+Z. Şeffaflık (alfa) hiç değişmez.</small>
</aside>
<div id="view"><canvas id="cv"></canvas><canvas id="ov"></canvas><div id="cursor"></div></div>
</main>
<script type="module" src="app.js?v=1"></script>
</body>
</html>
