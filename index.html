<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ürün Retouch – Faz 1</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&display=swap">
<style>
:root{--bg:#e8e9ec;--panel:#f7f7f8;--ink:#1b1d22;--mute:#5d6270;--line:#c7cad1;--gold:#8f6f22}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.5 Manrope,system-ui,sans-serif}
header{padding:28px 32px 8px}
h1{margin:0;font-size:26px;font-weight:800;letter-spacing:-.02em}
header p{margin:4px 0 0;color:var(--mute);max-width:60ch}
main{display:grid;grid-template-columns:300px 1fr;gap:20px;padding:20px 32px 40px}
aside{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:18px;align-self:start}
label{display:block;font-weight:600;margin:16px 0 4px}
input[type=range]{width:100%;accent-color:var(--gold)}
button,.pick{display:block;width:100%;padding:11px 14px;border:1px solid var(--ink);background:var(--ink);color:#fff;font:600 15px Manrope,sans-serif;border-radius:4px;cursor:pointer;text-align:center}
button:disabled{opacity:.4;cursor:default}
button.alt{background:transparent;color:var(--ink)}
button+button,.pick+button{margin-top:10px}
button:focus-visible,.pick:focus-within,input:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
#status{margin-top:14px;color:var(--mute);min-height:3em}
#bar{height:4px;background:var(--line);border-radius:2px;overflow:hidden;margin-top:8px}
#bar i{display:block;height:100%;width:0;background:var(--gold)}
.views{display:grid;grid-template-columns:1fr 1fr;gap:16px}
figure{margin:0}
figcaption{font-weight:600;margin-bottom:6px}
.stage{border:1px solid var(--line);border-radius:6px;min-height:320px;display:grid;place-items:center;overflow:hidden;
 background:repeating-conic-gradient(#fff 0 25%,#d9dbe0 0 50%) 0 0/20px 20px}
.stage canvas{max-width:100%;height:auto;display:block}
@media(max-width:900px){main{grid-template-columns:1fr;padding:16px}.views{grid-template-columns:1fr}header{padding:20px 16px 0}}
</style>
</head>
<body>
<header>
  <h1>Ürün Retouch – Faz 1</h1>
  <p>Fotoğrafı yükle, arka plan silinsin, tam çözünürlükte şeffaf PNG indir. Fotoğraf cihazından çıkmaz.</p>
</header>
<main>
  <aside>
    <label class="pick" style="margin:0;cursor:pointer">Fotoğraf seç (JPG / PNG)
      <input id="file" type="file" accept="image/*" hidden>
    </label>
    <label for="hard">Kenar sertliği</label>
    <input id="hard" type="range" min="0" max="100" value="60" disabled>
    <label for="choke">Kenarı içe çek</label>
    <input id="choke" type="range" min="0" max="100" value="10" disabled>
    <div style="height:14px"></div>
    <button id="dl" disabled>Şeffaf PNG indir</button>
    <div id="bar"><i></i></div>
    <div id="status" role="status" aria-live="polite">Bir fotoğraf seç. İlk kullanımda model indirilir (yüzlerce MB), sonra tarayıcı önbelleğinden açılır.</div>
  </aside>
  <section class="views">
    <figure><figcaption>Orijinal</figcaption><div class="stage"><canvas id="orig"></canvas></div></figure>
    <figure><figcaption>Sonuç</figcaption><div class="stage"><canvas id="res"></canvas></div></figure>
  </section>
</main>
<script type="module" src="app.js?v=3"></script>
</body>
</html>
