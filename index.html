<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Otomatik Ürün Retouch</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&display=swap">
<style>
:root{--bg:#e8e9ec;--panel:#f7f7f8;--ink:#1b1d22;--mute:#5d6270;--line:#c7cad1;--gold:#8f6f22}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.5 Manrope,system-ui,sans-serif}
header{padding:26px 32px 6px}
h1{margin:0;font-size:26px;font-weight:800;letter-spacing:-.02em}
header p{margin:4px 0 0;color:var(--mute);max-width:70ch}
.bar{display:flex;flex-wrap:wrap;gap:12px;align-items:end;padding:16px 32px}
.pick,button{padding:11px 18px;border:1px solid var(--ink);background:var(--ink);color:#fff;font:600 15px Manrope,sans-serif;border-radius:4px;cursor:pointer}
button.alt{background:transparent;color:var(--ink)}
button:disabled{opacity:.4;cursor:default}
select{padding:10px;border:1px solid var(--line);border-radius:4px;font:inherit;background:#fff}
label.f{display:grid;gap:4px;font-weight:600}
.pick:focus-within,button:focus-visible,select:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
#list{display:grid;grid-template-columns:repeat(auto-fill,minmax(420px,1fr));gap:16px;padding:0 32px 40px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:12px}
.card h2{margin:0 0 8px;font-size:15px;font-weight:600;word-break:break-all}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.stage{border:1px solid var(--line);border-radius:4px;display:grid;place-items:center;min-height:180px;overflow:hidden;
 background:repeating-conic-gradient(#fff 0 25%,#d9dbe0 0 50%) 0 0/16px 16px}
.stage canvas,.stage img{max-width:100%;max-height:340px;display:block}
.meta{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:8px;color:var(--mute)}
.meta a{color:var(--ink);font-weight:600}
</style>
</head>
<body>
<header>
  <h1>Otomatik Ürün Retouch</h1>
  <p>Fotoğrafları seç. Arka plan silinir, toz ve lekeler temizlenir, renk ve ışıltı iyileştirilir. Sonuç, şeffaf arka planlı ve tam çözünürlüklü PNG olarak iner. Fotoğraflar cihazından çıkmaz.</p>
</header>
<div class="bar">
  <label class="pick">Fotoğraf seç (birden fazla olabilir)<input id="file" type="file" accept="image/*" multiple hidden></label>
  <label class="f">Güç<select id="strength"><option value="hafif">Hafif</option><option value="orta" selected>Orta</option><option value="guclu">Güçlü</option></select></label>
  <label class="f">Önizleme zemini<select id="bgsel"><option value="checker">Damalı</option><option value="white">Beyaz</option><option value="dark">Koyu</option></select></label>
  <button id="zip" class="alt" disabled>Hepsini ZIP indir</button>
</div>
<div id="list"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script type="module" src="app.js?v=1"></script>
</body>
</html>
